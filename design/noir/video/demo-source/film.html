<!doctype html><html><head><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
.layer{position:absolute;inset:0;overflow:hidden;opacity:0}
#world{position:absolute;left:0;top:0;width:1920px;transform-origin:0 0}
#world img{position:absolute;left:0;top:0;width:1920px;opacity:0}
.cursor{position:absolute;width:34px;height:34px;z-index:30;filter:drop-shadow(0 4px 10px rgba(0,0,0,.7))}
.ripple{position:absolute;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;border:3px solid rgba(255,255,255,.9);opacity:0;z-index:29}
#cap{position:absolute;left:0;right:0;bottom:150px;text-align:center;font:500 46px Inter;letter-spacing:-.015em;color:#f3f4f6;text-shadow:0 2px 28px rgba(0,0,0,.95);opacity:0;z-index:50}
#cap b{font-weight:600;color:#fff}
#cap span{color:#8a8f98}
#capbg{position:absolute;left:0;right:0;bottom:0;height:420px;z-index:45;background:linear-gradient(180deg,transparent,rgba(0,0,0,.82) 60%,rgba(0,0,0,.95));opacity:0}
.bar{position:absolute;left:0;right:0;height:96px;background:#000;z-index:65}
#vign{position:absolute;inset:0;z-index:40;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.6))}
#grain{position:absolute;inset:0;z-index:60;opacity:.06;mix-blend-mode:overlay;pointer-events:none}
.k{font:500 20px 'JetBrains Mono',monospace;letter-spacing:.3em;color:#8a8f98}
.t{background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.55));-webkit-background-clip:text;color:transparent}
.chap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
</style></head><body>

<!-- intro -->
<div class=layer id=intro style="background:#000">
 <div class=chap>
  <img id=inN src="n-chrome.png" style="width:150px;height:150px">
  <div id=inT class=t style="margin-top:56px;font:700 120px/1 'Inter Display';letter-spacing:-.05em">Launch a profile coin.</div>
  <div id=inK class=k style="margin-top:36px">LIVE DEMO · ROBINHOOD CHAIN · SOLANA</div>
 </div>
</div>

<!-- chapter cards -->
<div class=layer id=ch1 style="background:#000"><div class=chap>
 <div id=ch1n class=k>CHAPTER 01</div>
 <img id=ch1i src="robinhood.png" style="margin-top:44px;width:150px;height:150px;border-radius:40px">
 <div id=ch1t class=t style="margin-top:44px;font:700 104px/1 'Inter Display';letter-spacing:-.05em">Robinhood Chain</div>
 <div id=ch1s style="margin-top:26px;font:400 30px Inter;color:#8a8f98">A @fomo profile, launched on Pons v2.</div>
</div></div>
<div class=layer id=ch2 style="background:#000"><div class=chap>
 <div id=ch2n class=k>CHAPTER 02</div>
 <img id=ch2i src="solana.jpg" style="margin-top:44px;width:150px;height:150px;border-radius:40px">
 <div id=ch2t class=t style="margin-top:44px;font:700 104px/1 'Inter Display';letter-spacing:-.05em">Solana</div>
 <div id=ch2s style="margin-top:26px;font:400 30px Inter;color:#8a8f98">A @Pumpfun profile, launched on Pump.fun.</div>
</div></div>

<!-- the app -->
<div class=layer id=app style="background:#09090b"><div id=world></div></div>

<!-- two chains -->
<div class=layer id=both style="background:#000"><div class=chap>
 <div style="display:flex;gap:70px;align-items:center">
  <img id=bo1 src="robinhood.png" style="width:150px;height:150px;border-radius:40px">
  <div id=boX style="font:300 60px Inter;color:#50545c">+</div>
  <img id=bo2 src="solana.jpg" style="width:150px;height:150px;border-radius:40px">
 </div>
 <div id=boT class=t style="margin-top:60px;font:700 112px/1 'Inter Display';letter-spacing:-.05em">Two chains. One click.</div>
</div></div>

<!-- outro -->
<div class=layer id=outro style="background:#000"><div class=chap>
 <img id=ouN src="n-chrome.png" style="width:170px;height:170px">
 <div id=ouT class=t style="margin-top:56px;font:700 128px/1 'Inter Display';letter-spacing:-.05em">Your profile. Now a market.</div>
 <div id=ouU style="margin-top:40px;font:600 34px Inter;color:#fff;letter-spacing:.02em">usenoir.app</div>
</div></div>

<svg class=cursor id=cur viewBox="0 0 24 24" style="left:0;top:0;opacity:0"><path d="M4 2 L4 19 L8.5 14.8 L11.6 21.6 L14.4 20.4 L11.3 13.7 L17.6 13.7 Z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
<div class=ripple id=rip></div>
<div id=vign></div>
<div id=capbg></div><div id=cap></div>
<div class=bar id=barT style="top:0"></div><div class=bar id=barB style="bottom:0"></div>
<svg id=grain width="100%" height="100%"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="3"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>
<div id=black style="position:absolute;inset:0;background:#000;z-index:70;opacity:1"></div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);
const inout = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
function kf(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, ...a] = keys[i], [t1, ...b] = keys[i + 1];
    if (t <= t1) { const k = inout((t - t0) / (t1 - t0)); return a.map((v, j) => lerp(v, b[j], k)); }
  }
  return keys[keys.length - 1].slice(1);
}
function show(id, t, a, b, fade = 0.6) { const o = Math.min(ease(seg(t, a, a + fade)), 1 - ease(seg(t, b - fade, b))); $(id).style.opacity = o; return o > 0; }
function rise(id, t, a, d = 0.9, dy = 30) { const o = ease(seg(t, a, a + d)); $(id).style.opacity = o; $(id).style.transform = `translateY(${dy * (1 - o)}px)`; }

/* ── screenshots (2x) laid in one world ── */
const SHOTS = "r0 r1-t2 r1-t4 r1-t6 r1-t8 r1-t10 r2 r3 r4 r5 r6 r7 s0 s1 s2-t2 s2-t4 s2-t5 s3 s4 s5 s6 s7 s8".split(" ");
$("world").innerHTML = SHOTS.map((n) => `<img id="i-${n}" src="shots/${n}.png">`).join("");
// [time, shot] — the shot shown from that time on (cuts with a short dissolve)
const CUTS = [
  [8.0, "r0"], [10.4, "r1-t2"], [10.65, "r1-t4"], [10.9, "r1-t6"], [11.15, "r1-t8"], [11.4, "r1-t10"],
  [12.7, "r2"], [16.3, "r3"], [18.2, "r4"], [20.0, "r5"], [21.2, "r6"], [23.1, "r7"],
  [32.0, "s0"], [33.3, "s1"], [34.6, "s2-t2"], [34.85, "s2-t4"], [35.1, "s2-t5"],
  [36.4, "s3"], [39.3, "s4"], [41.0, "s5"], [42.2, "s6"], [44.0, "s7"], [46.6, "s8"],
];
const DISSOLVE = { r2: 0.35, r4: 0.3, r7: 0.5, s1: 0.3, s3: 0.35, s4: 0.3, s7: 0.5 };
function showShot(t) {
  let cur = 0; for (let i = 0; i < CUTS.length; i++) if (t >= CUTS[i][0]) cur = i;
  for (const n of SHOTS) $("i-" + n).style.opacity = 0;
  const [t0, n] = CUTS[cur]; const d = DISSOLVE[n] || 0;
  const k = d ? ease(seg(t, t0, t0 + d)) : 1;
  if (cur > 0 && k < 1) $("i-" + CUTS[cur - 1][1]).style.opacity = 1;
  $("i-" + n).style.opacity = k; $("i-" + n).style.zIndex = 2; if (cur > 0) $("i-" + CUTS[cur - 1][1]).style.zIndex = 1;
}

/* ── camera (page coords → screen) ── */
let CAM = { fx: 960, fy: 540, s: 1 };
function camera(t) {
  const [fx, fy, s] = kf(t, [
    // Robinhood
    [8.0, 960, 560, 1.0], [9.6, 820, 560, 1.25], [12.2, 700, 540, 1.55], [13.4, 1000, 640, 1.15],
    [15.0, 1260, 700, 1.4], [16.6, 1200, 880, 1.5], [17.8, 1260, 980, 1.45], [18.6, 960, 560, 1.35],
    [19.8, 990, 600, 1.7], [20.6, 1260, 1020, 1.5], [22.9, 1260, 1060, 1.55],
    [23.2, 960, 560, 1.0], [25.2, 760, 480, 1.45], [27.5, 900, 520, 1.25], [28.6, 960, 560, 1.12],
    // Solana
    [32.0, 960, 560, 1.0], [33.2, 820, 420, 1.45], [34.2, 760, 500, 1.55], [36.2, 700, 540, 1.5],
    [37.6, 1260, 640, 1.3], [38.9, 1260, 900, 1.45], [39.6, 960, 560, 1.35], [40.7, 990, 600, 1.7],
    [41.6, 1260, 920, 1.5], [43.8, 1260, 940, 1.55],
    [44.0, 960, 560, 1.0], [45.6, 1300, 560, 1.5], [47.4, 1320, 640, 1.6], [48.6, 800, 700, 1.3], [50.4, 900, 640, 1.12],
  ]);
  CAM = { fx, fy, s };
  $("world").style.transform = `translate(${960 - fx * s}px, ${540 - fy * s}px) scale(${s})`;
}
function cursor(t) {
  const P = [
    [8.6, 960, 900], [9.8, 700, 506], [12.0, 700, 506], [12.4, 688, 567],
    [14.8, 900, 760], [15.8, 1140, 862], [16.6, 1140, 862], [17.6, 1260, 1041], [18.4, 1180, 760], [19.4, 1049, 651],
    [20.2, 1150, 900], [22.4, 1260, 1092], [23.0, 1262, 1094],
    [32.4, 1000, 700], [33.1, 818, 348], [34.0, 700, 506], [35.8, 690, 506], [36.2, 688, 567],
    [37.8, 1100, 760], [38.9, 1260, 939], [39.6, 1180, 760], [40.6, 1049, 651], [41.4, 1150, 820], [43.4, 1260, 939], [43.9, 1262, 940],
    [44.6, 1100, 760], [45.6, 1313, 543], [46.4, 1313, 543], [47.2, 1340, 708], [48.4, 1345, 712],
  ];
  const [x, y] = kf(t, P);
  const vis = (t > 8.6 && t < 23.0) || (t > 32.3 && t < 43.9) || (t > 44.5 && t < 48.4);
  const o = vis ? 1 : 0;
  $("cur").style.left = 960 + (x - CAM.fx) * CAM.s + "px";
  $("cur").style.top = 540 + (y - CAM.fy) * CAM.s + "px";
  $("cur").style.opacity = o;
  // clicks
  const CL = [[10.0, 700, 506], [12.55, 688, 567], [16.0, 1140, 862], [17.9, 1260, 1041], [19.7, 1049, 651], [22.8, 1260, 1092],
              [33.2, 818, 348], [34.3, 700, 506], [36.3, 688, 567], [39.1, 1260, 939], [40.85, 1049, 651], [43.75, 1260, 939], [45.8, 1313, 543], [47.4, 1340, 708]];
  const r = $("rip"); r.style.opacity = 0;
  for (const [ct, cx, cy] of CL) { const k = seg(t, ct, ct + 0.55); if (k > 0 && k < 1) { r.style.opacity = 1 - k; r.style.transform = `scale(${0.3 + k * 1.1})`; r.style.left = 960 + (cx - CAM.fx) * CAM.s + "px"; r.style.top = 540 + (cy - CAM.fy) * CAM.s + "px"; } }
}
function caption(t, items) {
  const c = $("cap"); let o = 0, html = "";
  for (const [a, b, h] of items) if (t >= a && t <= b) { o = Math.min(ease(seg(t, a, a + 0.45)), 1 - ease(seg(t, b - 0.45, b))); html = h; }
  c.style.opacity = o; $("capbg").style.opacity = o * 0.9; if (html && c.innerHTML !== html) c.innerHTML = html; c.style.transform = `translateY(${(1 - o) * 14}px)`;
}

window.DURATION = 62;
window.render = function (t) {
  $("black").style.opacity = 1 - ease(seg(t, 0.2, 1.2)) + ease(seg(t, 60.6, 61.8));
  // letterbox slides in for the app sections
  const lb = t > 7.6 && t < 51 ? 1 : 0.0;
  const bh = 96 * (ease(seg(t, 7.6, 8.4)) * (1 - ease(seg(t, 50.6, 51.2))));
  $("barT").style.height = bh + "px"; $("barB").style.height = bh + "px";

  if (show("intro", t, 0, 5.4, 0.7)) {
    rise("inN", t, 0.5, 1.1, 20); rise("inT", t, 1.3); rise("inK", t, 2.2);
    $("inN").style.filter = `drop-shadow(0 0 ${30 * ease(seg(t, 0.5, 2))}px rgba(205,212,235,.35))`;
    document.querySelector("#intro .chap").style.transform = `scale(${1 + 0.03 * seg(t, 0, 5.4)})`;
  }
  if (show("ch1", t, 5.2, 8.4, 0.6)) { rise("ch1n", t, 5.5); rise("ch1i", t, 5.7); rise("ch1t", t, 5.9); rise("ch1s", t, 6.2); }
  if (show("ch2", t, 29.0, 32.4, 0.6)) { rise("ch2n", t, 29.3); rise("ch2i", t, 29.5); rise("ch2t", t, 29.7); rise("ch2s", t, 30.0); }

  const inApp = show("app", t, 7.8, 29.4, 0.6) | show("app", t, 31.8, 51.0, 0.6);
  if ((t >= 7.8 && t <= 29.4) || (t >= 31.8 && t <= 51.0)) {
    $("app").style.opacity = t < 30 ? Math.min(ease(seg(t, 7.8, 8.4)), 1 - ease(seg(t, 28.8, 29.4))) : Math.min(ease(seg(t, 31.8, 32.4)), 1 - ease(seg(t, 50.4, 51.0)));
    showShot(t); camera(t); cursor(t);
  } else { $("app").style.opacity = 0; $("cur").style.opacity = 0; $("rip").style.opacity = 0; }

  if (show("both", t, 50.8, 55.4, 0.6)) { rise("bo1", t, 51.1); rise("boX", t, 51.4); rise("bo2", t, 51.6); rise("boT", t, 52.0); }
  if (show("outro", t, 55.2, 62, 0.7)) {
    rise("ouN", t, 55.5, 1.1, 20); rise("ouT", t, 56.2); rise("ouU", t, 57.2);
    $("ouN").style.filter = `drop-shadow(0 0 ${30 * ease(seg(t, 55.5, 57))}px rgba(205,212,235,.35))`;
  }

  caption(t, [
    [8.6, 10.2, "Start with any <b>@fomo</b> handle."],
    [10.3, 12.4, "Type it. <span>That's it.</span>"],
    [12.9, 15.6, "Name, ticker, avatar. <b>Filled in for you.</b>"],
    [15.8, 17.9, "Add an optional first buy."],
    [18.3, 20.2, "Your wallet signs. <b>Nothing is custodied.</b>"],
    [20.4, 22.9, "Live on <b>Robinhood Chain.</b>"],
    [23.6, 28.6, "A real market. <b>Chart, trading, creator fees.</b>"],
    [32.6, 34.4, "Switch to <b>@Pumpfun.</b> <span>Solana is picked for you.</span>"],
    [34.6, 36.2, "Same handle flow."],
    [36.6, 39.0, "Everything prefilled, <b>ready for Pump.fun.</b>"],
    [39.5, 41.4, "One signature."],
    [41.6, 43.8, "Live on <b>Solana.</b>"],
    [44.4, 50.2, "Trade it right on NOIR. <b>No tab switching.</b>"],
  ]);
};
window.render(0);
</script></body></html>
