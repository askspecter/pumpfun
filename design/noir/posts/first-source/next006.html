<!doctype html><html><head><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}body{background:#000;font-family:Inter,sans-serif}
.c{position:relative;overflow:hidden;background:#030303}
.sq{width:1600px;height:1600px}.ls{width:1600px;height:900px}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 4px);pointer-events:none}
.wm{position:absolute;display:flex;align-items:center;gap:16px;font:600 30px Inter;letter-spacing:.42em;color:#eef0f3}
.k{font:500 22px Inter;letter-spacing:.38em;color:#7d828c}
.g{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none}
.win{position:absolute;border-radius:26px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(180deg,rgba(18,19,23,.92),rgba(9,10,12,.96));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 80px 180px -40px rgba(0,0,0,.95),0 0 120px -30px rgba(124,140,255,.25);overflow:hidden}
.bar{height:58px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid rgba(255,255,255,.07)}
.dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.14)}
.title{margin-left:auto;margin-right:auto;font:500 18px 'JetBrains Mono';color:#50545c;letter-spacing:.08em}
.term{font:500 40px/1.75 'JetBrains Mono';color:#e9eaee;padding:44px 56px}
.p{color:#2fe39a}.m{color:#7d828c}.v{color:#c7cdff}
.prog{display:inline-block;letter-spacing:.02em}
.prog .on{color:#c7cdff;text-shadow:0 0 18px rgba(199,205,255,.55)}
.prog .off{color:#2a2c33}
.red{display:inline-block;background:#e9eaee;color:transparent;border-radius:4px;padding:0 6px;line-height:1.1;vertical-align:4px}
.cursor{display:inline-block;width:22px;height:44px;background:#2fe39a;vertical-align:-8px;margin-left:8px;box-shadow:0 0 18px rgba(47,227,154,.6)}
.soon{font:700 170px/1 'Inter Display';letter-spacing:-.055em;background:linear-gradient(180deg,#fff 35%,rgba(255,255,255,.5));-webkit-background-clip:text;color:transparent}
.glow{position:absolute;left:-10%;right:-10%;height:420px;background:radial-gradient(ellipse 820px 150px at 50% 50%,rgba(124,140,255,.28),transparent 72%)}
</style></head><body>

<div class="c sq" id=A>
 <div class=grid></div>
 <div class=glow style="top:420px"></div>
 <div class=wm style="left:96px;top:92px"><img src="../../../../public/noir-logo-128.png" style="width:46px;height:46px;border-radius:12px">NOIR</div>
 <div style="position:absolute;right:96px;top:100px" class=k>FILE 006</div>
 <div class=win style="left:150px;top:300px;width:1300px;height:540px">
  <div class=bar><span class=dot></span><span class=dot></span><span class=dot></span><span class=title>noir — next update</span></div>
  <div class=term>
   <div><span class=p>&gt;</span> noir --next</div>
   <div class=m>&nbsp; compiling…</div>
   <div>&nbsp; <span class=prog><span class=on>██████████</span><span class=off>██</span></span> <span class=v>83%</span></div>
   <div>&nbsp; <span class=m>status:</span> <span class=red>classified</span></div>
   <div><span class=p>&gt;</span><span class=cursor></span></div>
  </div>
 </div>
 <div style="position:absolute;left:0;right:0;top:1040px;text-align:center">
  <div class=soon>Soon.</div>
  <div class=k style="margin-top:46px">NOIR CONTINUES TO EVOLVE</div>
 </div>
 <div class=scan></div>
 <svg class=g width="100%" height="100%"><filter id="a"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#a)"/></svg>
</div>

<div class="c ls" id=B>
 <div class=grid></div>
 <div class=glow style="top:250px"></div>
 <div class=wm style="left:80px;top:72px"><img src="../../../../public/noir-logo-128.png" style="width:42px;height:42px;border-radius:11px">NOIR</div>
 <div style="position:absolute;right:80px;top:80px" class=k>FILE 006</div>
 <div class=win style="left:80px;top:200px;width:900px;height:480px">
  <div class=bar><span class=dot></span><span class=dot></span><span class=dot></span><span class=title>noir — next update</span></div>
  <div class=term style="font-size:34px;padding:40px 46px">
   <div><span class=p>&gt;</span> noir --next</div>
   <div class=m>&nbsp; compiling…</div>
   <div>&nbsp; <span class=prog><span class=on>██████████</span><span class=off>██</span></span> <span class=v>83%</span></div>
   <div>&nbsp; <span class=m>status:</span> <span class=red>classified</span></div>
   <div><span class=p>&gt;</span><span class=cursor style="height:38px;width:19px"></span></div>
  </div>
 </div>
 <div style="position:absolute;left:1060px;top:330px">
  <div class=soon style="font-size:150px">Soon.</div>
  <div class=k style="margin-top:34px;font-size:18px">NOIR CONTINUES TO EVOLVE</div>
 </div>
 <div class=scan></div>
 <svg class=g width="100%" height="100%"><filter id="b"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#b)"/></svg>
</div>
</body></html>
