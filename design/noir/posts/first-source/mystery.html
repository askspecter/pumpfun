<!doctype html><html><head><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}body{background:#000;font-family:Inter,sans-serif}
.c{position:relative;overflow:hidden;background:#000;width:1600px;height:1600px}
.wm{position:absolute;display:flex;align-items:center;gap:16px;font:600 30px Inter;letter-spacing:.42em;color:#eef0f3}
.m{font:500 22px 'JetBrains Mono',monospace;letter-spacing:.2em;color:#6b707a}
.g{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
.t{background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.5));-webkit-background-clip:text;color:transparent}
.red{display:inline-block;height:.82em;vertical-align:-.08em;background:#e9ebef;border-radius:3px}
.row{display:flex;align-items:center;gap:26px;padding:30px 0;border-top:1px solid rgba(255,255,255,.08);font:500 40px Inter;color:#d6d9df}
.row .n{font:500 22px 'JetBrains Mono',monospace;color:#50545c;width:60px}
</style></head><body>

<!-- A · macro: the mark, too close to read -->
<div class=c id=A>
 <img src="n-chrome.png" style="position:absolute;left:-520px;top:-260px;width:2500px;height:2500px;transform:rotate(-14deg);filter:brightness(.38) contrast(1.25)">
 <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 70%,#000 100%)"></div>
 <div class=wm style="left:96px;top:92px"><img src="noir-logo-128.png" style="width:46px;height:46px;border-radius:12px">NOIR</div>
 <div class=m style="position:absolute;right:96px;top:104px">FILE 002</div>
 <div style="position:absolute;left:96px;bottom:110px">
  <div class=m>NEXT UPDATE</div>
  <div class=t style="margin-top:26px;font:700 116px/1 'Inter Display';letter-spacing:-.05em">Not yet.</div>
 </div>
 <div class=m style="position:absolute;right:96px;bottom:118px">██/██/2026</div>
 <svg class=g width="100%" height="100%"><filter id="a"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#a)"/></svg>
</div>

<!-- B · redacted changelog -->
<div class=c id=B style="background:#050506">
 <div class=wm style="left:110px;top:110px"><img src="noir-logo-128.png" style="width:46px;height:46px;border-radius:12px">NOIR</div>
 <div class=m style="position:absolute;right:110px;top:122px;color:#8a8f98">INTERNAL · DO NOT SHARE</div>
 <div style="position:absolute;left:110px;right:110px;top:300px">
  <div class=m>CHANGELOG · NEXT</div>
  <div class=t style="margin-top:28px;font:700 104px/1.02 'Inter Display';letter-spacing:-.05em">What comes after<br>the launch.</div>
  <div style="margin-top:70px">
   <div class=row><span class=n>01</span>The launch flow, <span class=red style="width:330px"></span></div>
   <div class=row><span class=n>02</span>Markets that <span class=red style="width:420px"></span></div>
   <div class=row><span class=n>03</span><span class=red style="width:250px"></span> the profiles worth watching</div>
   <div class=row><span class=n>04</span><span class=red style="width:560px"></span> on every chain</div>
   <div class=row style="border-bottom:1px solid rgba(255,255,255,.08)"><span class=n>05</span><span class=red style="width:880px"></span></div>
  </div>
 </div>
 <div class=m style="position:absolute;left:110px;bottom:110px">REDACTED UNTIL RELEASE</div>
 <div class=m style="position:absolute;right:110px;bottom:110px;color:#e9ebef">usenoir.app</div>
 <svg class=g width="100%" height="100%"><filter id="b"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#b)"/></svg>
</div>

<!-- C · seen through the slats -->
<div class=c id=C>
 <div id=slat style="position:absolute;left:300px;top:260px;width:1000px;height:1000px"></div>
 <div class=wm style="left:96px;top:92px"><img src="noir-logo-128.png" style="width:46px;height:46px;border-radius:12px">NOIR</div>
 <div style="position:absolute;left:0;right:0;bottom:120px;text-align:center">
  <div class=t style="font:700 96px/1 'Inter Display';letter-spacing:-.05em">Something is taking shape.</div>
  <div class=m style="margin-top:34px">NEXT UPDATE · SOON</div>
 </div>
 <svg class=g width="100%" height="100%"><filter id="c"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3"/></filter><rect width="100%" height="100%" filter="url(#c)"/></svg>
</div>
<script>
// vertical slats: thin windows onto the mark, each offset so it reads as fragments
let h = "";
for (let i = 0; i < 20; i++) {
  const w = 50, gap = 0, x = i * w, dy = Math.sin(i * 1.3) * 26;
  const vis = i % 2 === 0;
  if (!vis) continue;
  h += `<div style="position:absolute;left:${x}px;top:0;width:${w - 22}px;height:1000px;overflow:hidden"><img src="n-chrome.png" style="position:absolute;left:${-x + 80}px;top:${80 + dy}px;width:840px;height:840px;filter:brightness(${0.45 + 0.4 * Math.abs(Math.sin(i * 0.7))})"></div>`;
}
document.getElementById("slat").innerHTML = h;
</script>
</body></html>
