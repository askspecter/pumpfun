<!doctype html><html><head><meta charset=utf-8><style>
*{margin:0;box-sizing:border-box}body{background:#000;font-family:Inter,sans-serif}
#c{width:1600px;height:900px;position:relative;overflow:hidden;background:#060607;padding:58px 70px}
.t{background:linear-gradient(180deg,#fff 40%,rgba(255,255,255,.6));-webkit-background-clip:text;color:transparent}
.p{position:relative;flex:1;border-radius:30px;padding:30px 22px 28px;text-align:center;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#111216,#0a0b0d)}

.f{margin-top:24px;font:700 44px 'Inter Display';letter-spacing:-.03em;color:#fff}
.fl{font:500 15px Inter;letter-spacing:.16em;color:#6b707a;margin-top:4px}
.g{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay;pointer-events:none}
</style></head><body>
